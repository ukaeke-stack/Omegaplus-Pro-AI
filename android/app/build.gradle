plugins { id 'com.android.application' }

android {
    namespace 'com.omegaplus.proai'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.omegaplus.proai'
        minSdk 23
        targetSdk 36
        versionCode 7
        versionName '1.6.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS')
            def keyPassword = System.getenv('ANDROID_KEY_PASSWORD')

            if (keystorePath && keystorePassword && keyAliasValue && keyPassword) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                setKeyAlias(keyAliasValue)
                setKeyPassword(keyPassword)
            }
        }
    }

    buildTypes {
        release {
            def signingReady = System.getenv('ANDROID_KEYSTORE_PATH') &&
                    System.getenv('ANDROID_KEYSTORE_PASSWORD') &&
                    System.getenv('ANDROID_KEY_ALIAS') &&
                    System.getenv('ANDROID_KEY_PASSWORD')

            if (signingReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

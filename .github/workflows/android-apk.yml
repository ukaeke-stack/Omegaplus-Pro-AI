name: Build Omegaplus APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omegaplus-Pro-AI-v1.6.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="android-v1.6.0"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG"               --title "Omegaplus Pro AI Android v1.6.0"               --notes "Current production Omegaplus Pro AI Android build."
          fi

          # GitHub can briefly return 404 while a newly-created release
          # propagates to the release-assets upload service. Retry safely.
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "app-debug.apk"; then
              echo "app-debug.apk is already attached to $TAG."
              exit 0
            fi

            if gh release upload "$TAG" "$APK" --clobber; then
              echo "APK uploaded successfully."
              exit 0
            fi

            echo "Release asset upload attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done

          echo "Failed to publish app-debug.apk after 5 attempts."
          exit 1

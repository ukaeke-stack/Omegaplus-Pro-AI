name: Build Omegaplus APK

on:
  push:
    branches:
      - main
      - integration-omegaplus-current
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omegaplus-Pro-AI-v1.2.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.2.0"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Omegaplus Pro AI Android v1.2.0" --notes "Current production Omegaplus Pro AI Android build."
          gh release upload "$TAG" android/app/build/outputs/apk/debug/app-debug.apk --clobber

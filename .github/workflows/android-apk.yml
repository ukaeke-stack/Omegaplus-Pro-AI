name: Build Omegaplus AI APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omegaplus-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.1.0"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Omegaplus AI Android v1.1.0" --notes "Omegaplus AI Android update with in-app APK updater support."
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber

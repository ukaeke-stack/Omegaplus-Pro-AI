name: Production Auto Rollback

on:
  deployment_status:

permissions:
  contents: read

jobs:
  health-check-and-rollback:
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production propagation
        run: sleep 20

      - name: Check production health
        id: health
        env:
          PRODUCTION_URL: https://omegaplus-pro-ai.vercel.app
        run: |
          set -e
          ok=0
          for i in 1 2 3 4 5; do
            body="$(curl -fsS --max-time 15 "$PRODUCTION_URL/health" || true)"
            echo "$body"
            if echo "$body" | grep -q '"status":"healthy"'; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Production health check failed."
            exit 1
          fi

      - name: Roll back to previous production deployment
        if: failure() && steps.health.outcome == 'failure'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_hmKdFW378LauHThdRt5awow5SBf8
          VERCEL_TEAM_ID: team_iBAh0X2UsEES0UejqSZSCNlT
          FAILED_DEPLOYMENT_ID: ${{ github.event.deployment.id }}
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN GitHub Actions secret is not configured. Add it before relying on automatic rollback."
            exit 1
          fi

          deployments="$(curl -fsS             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&target=production&limit=20")"

          previous="$(echo "$deployments" | jq -r --arg failed "$FAILED_DEPLOYMENT_ID" '
            [.deployments[]
              | select(.readyState == "READY")
              | select(.id != $failed)
              | .id][0] // empty')"

          if [ -z "$previous" ]; then
            echo "::error::No previous READY production deployment was found."
            exit 1
          fi

          echo "Rolling production back to $previous"
          curl -fsS -X POST             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Content-Type: application/json"             "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$previous?teamId=$VERCEL_TEAM_ID"             -d '{}'

          echo "Rollback requested successfully."

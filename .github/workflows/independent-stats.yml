name: Independent statistics checks

on:
  pull_request:
    paths:
      - "server.js"
      - "independent-stats.js"
      - "goal-api-stats.js"
      - "model-ensemble.js"
      - "analyzer-reliability.js"
      - "test/independent-stats.test.js"
      - "package.json"
      - ".github/workflows/independent-stats.yml"
  push:
    branches:
      - feature/independent-stats-main-v2
    paths:
      - "server.js"
      - "independent-stats.js"
      - "goal-api-stats.js"
      - "model-ensemble.js"
      - "test/independent-stats.test.js"
      - "package.json"
      - ".github/workflows/independent-stats.yml"

jobs:
  independent-statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check independent-stats.js
      - run: node --check goal-api-stats.js
      - run: node --check model-ensemble.js
      - run: node --check analyzer-reliability.js
      - run: npm test

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07120e"><title>Set New Password · Omegaplus Pro AI</title><style>body{margin:0;background:#06100b;color:#eef5f0;font:15px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px;box-sizing:border-box}.card{width:min(440px,100%);background:#0b1710;border:1px solid #1a2d22;border-radius:18px;padding:22px;box-sizing:border-box}.brand{font-weight:900;font-size:24px}.muted{color:#8c9991}.field{display:grid;gap:6px;margin:12px 0}.field input{box-sizing:border-box;width:100%;border:1px solid #263b30;background:#0e1b14;color:#eef5f0;border-radius:10px;padding:12px}.btn{width:100%;border:1px solid #20342a;background:#0e1b14;color:#eef5f0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.primary{background:#18e76b;color:#04150b;border-color:#18e76b}.status{min-height:20px;color:#18e76b;font-size:12px;margin-top:10px}.danger{color:#ff8179}.links{margin-top:14px}.links a{color:#18e76b;text-decoration:none}.generate{margin:8px 0}</style></head><body><main class="card"><div class="brand">Set a New Password</div><p class="muted">Choose a new password. You can also generate a strong one automatically.</p><form id="form"><div class="field"><label>New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button type="button" class="btn generate" id="generate">Generate secure password</button><button class="btn primary" type="submit">Set new password</button></form><div id="status" class="status"></div><div class="links"><a href="/login.html">Back to login</a></div></main><script>const $=s=>document.querySelector(s),token=new URLSearchParams(location.search).get("token")||"";function gen(){const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";let x="";for(let i=0;i<18;i++)x+=chars[Math.floor(Math.random()*chars.length)];$("#password").value=x;$("#confirm").value=x;$("#password").type="text";$("#confirm").type="text";$("#status").textContent="Strong password generated. Copy/save it before continuing."}$("#generate").onclick=gen;$("form").onsubmit=async e=>{e.preventDefault();const st=$("#status");if(!token){st.textContent="Reset link is missing or invalid.";st.className="status danger";return}if($("#password").value!==$("#confirm").value){st.textContent="Passwords do not match.";st.className="status danger";return}st.textContent="Updating password…";st.className="status";try{const r=await fetch("/api/auth/reset-password",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token,password:$("#password").value})}),d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to reset password.");st.textContent=d.message||"Password changed successfully.";setTimeout(()=>location.href="/login.html",1200)}catch(x){st.textContent=x.message;st.className="status danger"}}</script></body></html>

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07120e"><title>Login · Omegaplus Pro AI</title><style>body{margin:0;background:#06100b;color:#eef5f0;font:15px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px;box-sizing:border-box}.card{width:min(420px,100%);background:#0b1710;border:1px solid #1a2d22;border-radius:18px;padding:22px;box-sizing:border-box}.brand{font-weight:900;font-size:24px}.muted{color:#8c9991}.field{display:grid;gap:6px;margin:14px 0}.field input{box-sizing:border-box;width:100%;border:1px solid #263b30;background:#0e1b14;color:#eef5f0;border-radius:10px;padding:12px}.btn{width:100%;border:1px solid #20342a;background:#0e1b14;color:#eef5f0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.primary{background:#18e76b;color:#04150b;border-color:#18e76b}.links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}.links a{color:#18e76b;text-decoration:none}.status{min-height:20px;color:#18e76b;font-size:12px;margin-top:10px}.danger{color:#ff8179}</style></head><body><main class="card"><div class="brand">Omegaplus Pro AI</div><p class="muted">Sign in to your account.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Login</button></form><div id="status" class="status"></div><div class="links"><a href="/forgot-password.html">Forgot password?</a><a href="/create-account.html">Create account</a><a href="/">Back to app</a></div></main><script>const $=s=>document.querySelector(s);$("form").onsubmit=async e=>{e.preventDefault();const st=$("#status");st.textContent="Signing in…";st.className="status";try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:$("#email").value,password:$("#password").value})}),d=await r.json();if(!r.ok)throw new Error(d.error||"Login failed.");location.href=d.user?.role==="admin"?"/admin.html":"/"}catch(x){st.textContent=x.message;st.className="status danger"}}</script></body></html>

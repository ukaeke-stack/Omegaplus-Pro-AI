<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07120e"><title>Login · Omegaplus Pro AI</title><style>body{margin:0;background:#06100b;color:#eef5f0;font:15px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px;box-sizing:border-box}.card{width:min(420px,100%);background:#0b1710;border:1px solid #1a2d22;border-radius:18px;padding:22px;box-sizing:border-box}.brand{font-weight:900;font-size:24px}.muted{color:#8c9991}.field{display:grid;gap:6px;margin:14px 0}.field input{box-sizing:border-box;width:100%;border:1px solid #263b30;background:#0e1b14;color:#eef5f0;border-radius:10px;padding:12px}.btn{width:100%;border:1px solid #20342a;background:#0e1b14;color:#eef5f0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.primary{background:#18e76b;color:#04150b;border-color:#18e76b}.primary:disabled{opacity:.65;cursor:wait}.links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}.links a{color:#18e76b;text-decoration:none}.password-wrap{position:relative}.password-wrap input{padding-right:72px}.password-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#9eaaa3;cursor:pointer;font-size:12px;font-weight:800;line-height:1;padding:8px}.password-toggle:hover{color:#eef5f0}.password-toggle:focus{outline:2px solid #18e76b;outline-offset:1px;border-radius:6px}.status{min-height:20px;color:#18e76b;font-size:13px;margin-top:10px}.danger{color:#ff8179}.success{color:#18e76b}</style></head><body><main class="card"><div class="brand">Omegaplus Pro AI</div><p class="muted">Sign in to your account.</p><form id="form" novalidate><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" title="Show password">Show</button></div></div><button id="loginButton" class="btn primary" type="submit">Login</button></form><div id="status" class="status" role="status" aria-live="polite"></div><div class="links"><a href="/forgot-password.html">Forgot password?</a><a href="/create-account.html">Create account</a><a href="/">Back to app</a></div></main><script>const $=s=>document.querySelector(s);const form=$("#form"),status=$("#status"),loginButton=$("#loginButton"),password=$("#password"),toggle=$("#passwordToggle");toggle.addEventListener("click",()=>{const show=password.type==="password";password.type=show?"text":"password";toggle.textContent=show?"Hide":"Show";toggle.setAttribute("aria-label",show?"Hide password":"Show password");toggle.title=show?"Hide password":"Show password";password.focus()});form.addEventListener("submit",async e=>{e.preventDefault();const email=$("#email").value.trim(),pass=password.value;if(!email||!pass){status.textContent="Enter your email and password.";status.className="status danger";return}status.textContent="Signing in…";status.className="status";loginButton.disabled=true;try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);let r;try{r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},credentials:"same-origin",body:JSON.stringify({email,password:pass}),signal:controller.signal})}finally{clearTimeout(timer)}const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{}if(!r.ok)throw new Error(d.error||("Login failed (HTTP "+r.status+")."));if(!d.user)throw new Error("Login succeeded but no account session was returned.");status.textContent="Login successful. Opening your account…";status.className="status success";window.location.replace(d.user.role==="admin"?"/admin.html":"/")}catch(x){status.textContent=x.name==="AbortError"?"Login timed out. Please try again.":(x.message||"Unable to sign in.");status.className="status danger";loginButton.disabled=false}});</script></body></html>

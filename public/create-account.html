<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07120e"><title>Create Account · Omegaplus Pro AI</title><style>body{margin:0;background:#06100b;color:#eef5f0;font:15px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px;box-sizing:border-box}.card{width:min(460px,100%);background:#0b1710;border:1px solid #1a2d22;border-radius:18px;padding:22px;box-sizing:border-box}.brand{font-weight:900;font-size:24px}.muted{color:#8c9991}.field{display:grid;gap:6px;margin:12px 0}.field input{box-sizing:border-box;width:100%;border:1px solid #263b30;background:#0e1b14;color:#eef5f0;border-radius:10px;padding:12px}.btn{width:100%;border:1px solid #20342a;background:#0e1b14;color:#eef5f0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.primary{background:#18e76b;color:#04150b;border-color:#18e76b}.links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}.links a{color:#18e76b;text-decoration:none}.password-wrap{position:relative}.password-wrap input{padding-right:48px}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#9eaaa3;cursor:pointer;font-size:20px;line-height:1;padding:6px}.password-toggle:focus{outline:2px solid #18e76b;outline-offset:1px;border-radius:6px}.status{min-height:20px;color:#18e76b;font-size:12px;margin-top:10px}.danger{color:#ff8179}</style></head><body><main class="card"><div class="brand">Create Omegaplus Account</div><p class="muted">Enter the information below to create your account.</p><form id="form"><div class="field"><label>Full name</label><input id="name" autocomplete="name" required></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" data-target="password" aria-label="Show password" title="Show password">◉</button></div><div class="field"><label>Confirm password</label><div class="password-wrap"><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" data-target="confirm" aria-label="Show password" title="Show password">◉</button></div><button class="btn primary" type="submit">Create account</button></form><div id="status" class="status"></div><div class="links"><a href="/login.html">Already have an account? Login</a><a href="/">Back to app</a></div></main><script>const $=s=>document.querySelector(s);$("form").onsubmit=async e=>{e.preventDefault();const st=$("#status");if($("#password").value!==$("#confirm").value){st.textContent="Passwords do not match.";st.className="status danger";return}st.textContent="Creating account…";st.className="status";try{const r=await fetch("/api/auth/register",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:$("#name").value,email:$("#email").value,password:$("#password").value})}),d=await r.json();if(!r.ok)throw new Error(d.error||"Could not create account.");location.href="/"}catch(x){st.textContent=x.message;st.className="status danger"}}document.querySelectorAll(".password-toggle").forEach(b=>b.onclick=()=>{const x=document.getElementById(b.dataset.target),show=x.type==="password";x.type=show?"text":"password";b.textContent=show?"◉":"○";b.setAttribute("aria-label",show?"Hide password":"Show password");b.title=show?"Hide password":"Show password"});</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07120e"><title>Omegaplus Admin</title><link rel="icon" href="/icon.svg"><style>
body{margin:0;background:#06100b;color:#eef5f0;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#0b1710;border:1px solid #1a2d22;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric b{display:block;font-size:28px;margin-top:8px}.muted{color:#8c9991}.danger{color:#ff7b72}.ok{color:#18e76b}.btn,input,select{box-sizing:border-box;border:1px solid #263b30;background:#0e1b14;color:#eef5f0;border-radius:9px;padding:10px}.btn{cursor:pointer;font-weight:700}.primary{background:#18e76b;color:#04150b;border-color:#18e76b}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #1a2d22;text-align:left;vertical-align:top}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}#login{max-width:420px;margin:12vh auto}.field{display:grid;gap:6px;margin:10px 0}.field input{width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}.table{font-size:12px;display:block;overflow:auto;white-space:nowrap}}</style></head><body><main>
<section id="login" class="card"><h1>Omegaplus Admin</h1><p class="muted">Protected administrator console.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">Admin Login</button><p id="loginStatus" class="muted"></p></section>
<section id="panel" class="hidden"><div class="top"><div><h1>Admin Console</h1><p id="who" class="muted"></p></div><button id="logout" class="btn">Logout</button></div>
<div class="grid"><div class="card metric">Users<b id="users">—</b></div><div class="card metric">Paid Users<b id="paid">—</b></div><div class="card metric">Active Sessions<b id="sessions">—</b></div></div>
<section class="card"><div class="top"><h2>Users</h2><button id="refreshUsers" class="btn">Refresh</button></div><div class="row"><input id="search" placeholder="Search email or name"><button id="searchBtn" class="btn">Search</button></div><div style="overflow:auto;margin-top:12px"><table class="table"><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Plan</th><th>Active</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table></div></section>
<section class="card"><h2>Plans</h2><div id="plans"></div></section>
<p id="status" class="muted"></p></section></main><script src="/admin.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07120e"><title>Omegaplus Subscription</title><link rel="icon" href="/icon.svg"><style>
body{margin:0;background:#06100b;color:#eef5f0;font:15px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#8c9991}.card{background:#0b1710;border:1px solid #1a2d22;border-radius:18px;padding:18px;margin:14px 0}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.plan{display:flex;flex-direction:column;gap:10px}.price{font-size:30px;font-weight:900}.features{padding-left:20px;line-height:1.8;color:#b9c4bd}.btn{border:1px solid #263b30;background:#0e1b14;color:#eef5f0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#18e76b;color:#04150b;border-color:#18e76b}.badge{color:#18e76b;font-weight:800}.hidden{display:none}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #1a2d22;text-align:left}@media(max-width:760px){.plans{grid-template-columns:1fr}}
